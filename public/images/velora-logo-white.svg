<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B772" />
      <stop offset="50%" stop-color="#C79A58" />
      <stop offset="100%" stop-color="#A67C3B" />
    </linearGradient>
  </defs>

  <!-- Winged V Emblem -->
  <g transform="translate(250, 160)">
    <!-- Left White/Silver Wing -->
    <path d="M -115 -75 C -90 -75 -60 -40 -30 20 C -20 40 -8 65 0 80 C -8 65 -25 30 -50 0 C -70 -25 -95 -50 -115 -75 Z" fill="#FFFFFF" />
    <path d="M -115 -75 C -70 -70 -35 -15 0 80 C -20 50 -60 10 -115 -75 Z" fill="#FFFFFF" />
    
    <!-- Top Right White Arc -->
    <path d="M 0 80 C 15 40 45 -20 115 -75 C 90 -75 60 -45 30 0 C 15 25 5 55 0 80 Z" fill="#FFFFFF" />

    <!-- Flowing Gold Ribbon Wing -->
    <path d="M -75 65 C -20 62 30 45 75 0 C 95 -20 110 -40 115 -55 C 105 -35 85 -10 60 15 C 25 50 -25 65 -75 65 Z" fill="url(#goldGradW)" />
    <path d="M -75 65 C -40 65 10 50 60 18 C 90 -2 110 -30 115 -55 C 100 -30 75 0 35 30 C -5 60 -45 65 -75 65 Z" fill="url(#goldGradW)" opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <text x="250" y="340" text-anchor="middle" font-family="'Montserrat', 'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="76" font-weight="800" letter-spacing="12" fill="#FFFFFF">
    VELORA
  </text>

  <!-- Slogan with gold lines -->
  <g transform="translate(250, 395)">
    <!-- Left Gold Line -->
    <line x1="-190" y1="-5" x2="-120" y2="-5" stroke="url(#goldGradW)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Slogan Text -->
    <text x="0" y="0" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-size="19" font-weight="600" letter-spacing="4.5" fill="#E5E7EB">
      TARZIN ADIMLARINDA
    </text>
    
    <!-- Right Gold Line -->
    <line x1="120" y1="-5" x2="190" y2="-5" stroke="url(#goldGradW)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
